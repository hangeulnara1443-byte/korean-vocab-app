<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="韓国語練習">
<meta name="theme-color" content="#1D9E75">
<title>キャンパス韓国語 文型練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;padding:1rem;background:#f9f9f9;color:#111;max-width:480px;margin:0 auto;}

/* ── 로그인 화면 ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;}
.login-logo{font-size:40px;margin-bottom:4px;}
.login-title{font-size:20px;font-weight:500;color:#111;text-align:center;}
.login-sub{font-size:13px;color:#666;text-align:center;line-height:1.6;}
.login-box{width:100%;background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.08);}
.login-label{font-size:12px;color:#666;margin-bottom:6px;display:block;}
.login-input-wrap{display:flex;align-items:center;border:1.5px solid #ddd;border-radius:10px;overflow:hidden;background:white;margin-bottom:14px;}
.login-prefix{padding:12px 10px 12px 14px;font-size:18px;font-weight:500;color:#1D9E75;background:#E1F5EE;border-right:1.5px solid #ddd;}
.login-input{flex:1;padding:12px 14px;font-size:20px;font-weight:500;border:none;outline:none;letter-spacing:3px;font-family:monospace;}
.login-btn{width:100%;padding:14px;background:#1D9E75;color:white;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;transition:background 0.15s;}
.login-btn:hover{background:#178060;}
.login-btn:disabled{background:#aaa;cursor:not-allowed;}
.login-err{font-size:12px;color:#A32D2D;text-align:center;min-height:18px;margin-bottom:8px;}

/* ── 학생 정보 표시 바 ── */
#user-bar{display:none;background:#E1F5EE;border-radius:10px;padding:8px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
#user-bar.show{display:flex;}
.ub-id{font-size:13px;font-weight:500;color:#085041;}
.ub-session{font-size:11px;color:#3B8A6E;}
.ub-logout{font-size:11px;color:#666;cursor:pointer;text-decoration:underline;}

/* ── 전송 상태 표시 ── */
.class-btn{flex:1;padding:12px;border:2px solid #ddd;border-radius:10px;background:white;font-size:18px;font-weight:500;cursor:pointer;color:#666;transition:all 0.15s;}
.class-btn.selected{border-color:#1D9E75;background:#E1F5EE;color:#085041;font-weight:700;}
.class-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.hd{text-align:center;margin-bottom:1.1rem;}
.hd h1{font-size:20px;font-weight:500;margin-bottom:4px;}
.hd p{font-size:12px;color:#666;}
.badge{display:inline-block;background:#E1F5EE;color:#0F6E56;font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:6px;}
.ls-label{font-size:11px;color:#666;margin-bottom:5px;display:block;}
.lg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:4px;}
.lbtn{padding:6px 2px;border:1px solid #ddd;border-radius:6px;background:#f5f5f5;cursor:pointer;font-size:10px;color:#666;text-align:center;line-height:1.4;}
.lbtn:hover{border-color:#1D9E75;color:#1D9E75;}
.lbtn.active{background:#1D9E75;color:white;border-color:#1D9E75;font-weight:500;}
.lbtn.done{background:#EAF3DE;border-color:#3B6D11;color:#3B6D11;}
.li{background:#f0f0f0;border-radius:10px;padding:9px 13px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;}
.li-n{font-size:11px;color:#1D9E75;font-weight:500;}
.li-t{font-size:13px;font-weight:500;margin-top:1px;}
.li-g{font-size:10px;color:#666;margin-top:2px;}
.sc{text-align:right;}
.sc-v{font-size:22px;font-weight:500;color:#1D9E75;}
.sc-l{font-size:10px;color:#666;}
.pr{display:flex;justify-content:space-between;margin-bottom:4px;}
.pr span{font-size:11px;color:#666;}
.pb{height:4px;background:#ddd;border-radius:2px;margin-bottom:11px;}
.pf{height:100%;background:#1D9E75;border-radius:2px;transition:width 0.3s;}
.hc{display:inline-flex;align-items:center;gap:5px;background:#FAEEDA;border:1px solid #EF9F27;border-radius:20px;padding:5px 14px;font-size:13px;color:#854F0B;margin-bottom:9px;}
.hl{font-size:10px;color:#BA7517;font-weight:500;}
.qc{background:#f0f0f0;border-radius:10px;padding:1rem;margin-bottom:9px;}
.qk{font-size:17px;line-height:2.6;}
.bl{display:inline-block;min-width:90px;border-bottom:2.5px solid #1D9E75;text-align:center;color:#1D9E75;font-weight:500;padding:0 5px;transition:all 0.2s;}
.bl.ok{border-bottom:2.5px solid #3B6D11;color:#3B6D11;background:#EAF3DE;border-radius:3px;padding:2px 7px;}
.bl.ng{border-bottom:2.5px solid #A32D2D;color:#A32D2D;background:#FCEBEB;border-radius:3px;padding:2px 7px;}
.os{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.ob{padding:8px 14px;border:1px solid #ccc;border-radius:20px;background:white;cursor:pointer;font-size:14px;transition:all 0.15s;}
.ob:hover{border-color:#1D9E75;background:#E1F5EE;}
.ob.used{opacity:0.35;pointer-events:none;}
.ob.co{background:#EAF3DE;border-color:#3B6D11;color:#3B6D11;font-weight:500;}
.fb{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:8px;display:none;line-height:1.7;}
.fb.show{display:block;}
.fb.ok{background:#EAF3DE;color:#3B6D11;}
.fb.ng{background:#FCEBEB;color:#A32D2D;}
.fb-f{font-size:13px;font-weight:500;margin-bottom:2px;}
.fb-n{font-size:11px;opacity:0.88;}
.nb{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;background:#1D9E75;color:white;cursor:pointer;font-size:14px;font-weight:500;display:none;}
.nb.show{display:block;}
.fin{text-align:center;padding:1.5rem 1rem;}
.fin h3{font-size:17px;font-weight:500;margin-bottom:4px;}
.fin .big{font-size:28px;font-weight:500;color:#1D9E75;margin:10px 0;}
.fin .gram{font-size:12px;color:#666;margin-bottom:14px;}
.fbs{display:flex;gap:8px;justify-content:center;}
.fbs button{padding:9px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;}
.fr{background:#1D9E75;color:white;border:none;}
.fn{background:transparent;color:#1D9E75;border:1px solid #1D9E75;}
.tip{background:#E1F5EE;border-radius:8px;padding:8px 12px;margin-top:8px;}
.tip p{font-size:11px;color:#0F6E56;}
.sn{font-size:10px;background:#EEEDFE;color:#3C3489;border-radius:10px;padding:2px 8px;margin-left:4px;}
</style>
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen">
  <div class="login-logo">🇰🇷</div>
  <div class="login-title">キャンパス韓国語<br>文型練習</div>
  <div class="login-sub">先生から配布された<br>ログインIDを入力してください</div>
  <div class="login-box">
    <span class="login-label">① クラスを選択してください</span>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <button class="class-btn" id="btn-A" onclick="selectClass('A')">A クラス</button>
      <button class="class-btn" id="btn-B" onclick="selectClass('B')">B クラス</button>
    </div>
    <span class="login-label">② 出席番号を入力してください</span>
    <div class="login-input-wrap">
      <div class="login-prefix" id="class-prefix">　</div>
      <input class="login-input" id="code-input" type="number"
        placeholder="01" maxlength="2"
        oninput="this.value=this.value.slice(0,2)"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-err" id="login-err">　</div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">ログイン →</button>
  </div>
  <div style="font-size:11px;color:#aaa;text-align:center;">
    キャンパス韓国語 第2版 準拠<br>第5課〜第13課
  </div>
</div>

<!-- ── メイン画面 ── -->
<div id="main-screen" style="display:none;">
  <div id="user-bar" class="show">
    <div>
      <div class="ub-id" id="ub-id-text"></div>
      <div class="ub-session" id="ub-session-text"></div>
    </div>
    <span class="ub-logout" onclick="doLogout()">ログアウト</span>
  </div>
<div class="hd">
  <span class="badge">キャンパス韓国語 第2版</span>
  <h1>文型練習 — 穴埋め問題</h1>
  <p>教科書の順序・語彙・文体に準拠　第5課〜第13課</p>
</div>
<div style="margin-bottom:1rem;">
  <span class="ls-label">▸ 前半 第5〜10課 <span class="sn">합니다体</span></span>
  <div class="lg" id="ga"></div>
  <div style="height:6px"></div>
  <span class="ls-label">▸ 後半 第11〜13課 <span class="sn">해요体</span></span>
  <div class="lg" id="gb"></div>
</div>
<div id="body"></div>

</div><!-- /main-screen -->

/* ════════════════════════════════════════════
   ★ Google Apps Script URL
   　 後で先生のURLを貼り付けてください
   ════════════════════════════════════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzKDDICdAdlpSiU9U-8Oa0NnjOR0--qx0vzFs96O5g__ENkZaRdcUOKAxhyP33-Zg/exec';

/* ── 状態変数 ── */
let cur=0, qi=0, qs=0, qo=[], answered=false;
let studentId='', sessionId='', sessionStart=0, qStart=0;
let sessionLog=[];   // 送信待ちログをここに蓄積
const done={};

/* ── ユーティリティ ── */
function sh(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function nowStr(){return new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'});}
function genSession(){return Date.now().toString(36).toUpperCase();}

/* ════════════════════════════════════
   ログイン / ログアウト
   ════════════════════════════════════ */
/* ── 클래스별 인원 설정 ── */
const CLASS_MAX = { A: 35, B: 28 };
let selectedClass = '';

function selectClass(c) {
  selectedClass = c;
  document.getElementById('btn-A').classList.toggle('selected', c==='A');
  document.getElementById('btn-B').classList.toggle('selected', c==='B');
  document.getElementById('class-prefix').textContent = c;
  document.getElementById('login-err').textContent = '';
  document.getElementById('code-input').focus();
}

function doLogin(){
  const err = document.getElementById('login-err');
  // 반 선택 확인
  if(!selectedClass){
    err.textContent = 'クラス（AまたはB）を選択してください';
    return;
  }
  const v = document.getElementById('code-input').value.trim();
  const n = parseInt(v);
  const max = CLASS_MAX[selectedClass];
  if(!v || isNaN(n) || n < 1 || n > max){
    err.textContent = `番号を正しく入力してください（01〜${String(max).padStart(2,'0')}）`;
    return;
  }
  err.textContent = '';
  studentId = selectedClass + String(n).padStart(2,'0');
  sessionId = genSession();
  sessionStart = Date.now();

  // 화면 전환
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  document.getElementById('ub-id-text').textContent = studentId + ' さん';
  document.getElementById('ub-session-text').textContent =
    'セッション開始: ' + nowStr();

  // 세션 시작 로그
  sendLog({
    type:'SESSION_START', student:studentId, session:sessionId,
    timestamp:nowStr(), lessonNum:'', questionNum:'',
    correct:'', answer:'', rt_ms:'', score:''
  });

  grids(); rb(); ui(); sel(0);
}

function doLogout(){
  // セッション終了ログ
  const elapsed = Math.round((Date.now()-sessionStart)/1000);
  sendLog({
    type:'SESSION_END', student:studentId, session:sessionId,
    timestamp:nowStr(), lessonNum:'', questionNum:'',
    correct:'', answer:'', rt_ms:'', score:String(elapsed)+'sec'
  });
  // リセット
  studentId=''; sessionId=''; sessionLog=[];
  Object.keys(done).forEach(k=>delete done[k]);
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('code-input').value='';
  document.getElementById('login-err').style.display='none';
}

/* ════════════════════════════════════
   Google Sheets ログ送信 (GET方式)
   ════════════════════════════════════ */
function sendLog(data){
  if(!GAS_URL){ console.log('[LOG]', data); return; }
  const encoded = encodeURIComponent(JSON.stringify(data));
  const url = GAS_URL + '?data=' + encoded;
  fetch(url, { method:'GET', mode:'no-cors' })
    .catch(()=>{ sessionLog.push(data); });
}

// オフライン時に蓄積したログを再送
function flushLog(){
  if(!GAS_URL || sessionLog.length===0) return;
  const batch=[...sessionLog]; sessionLog=[];
  batch.forEach(d=>sendLog(d));
}
window.addEventListener('online', flushLog);

/* ════════════════════════════════════
   学習画面ロジック
   ════════════════════════════════════ */
function grids(){
  ['ga','gb'].forEach(id=>document.getElementById(id).innerHTML='');
  L.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='lbtn'+(i===cur?' active':'')+(done[i]?' done':'');
    b.innerHTML='第'+l.num+'課';
    b.onclick=()=>sel(i);
    document.getElementById(i<6?'ga':'gb').appendChild(b);
  });
}

function sel(i){
  cur=i; qi=0; qs=0; answered=false;
  qo=sh([...Array(L[i].qs.length).keys()]);
  grids(); rb(); ui(); loadQ();
}

function ui(){
  const l=L[cur];
  document.getElementById('li-n').textContent='第'+l.num+'課';
  document.getElementById('li-t').textContent=l.title;
  document.getElementById('li-g').textContent=l.gram;
  document.getElementById('sc-v').textContent='0';
}

function loadQ(){
  const l=L[cur];
  if(qi>=l.qs.length){fin();return;}
  answered=false;
  qStart=Date.now(); // ★ 反応時間計測開始
  document.getElementById('fb').className='fb';
  document.getElementById('nb').classList.remove('show');
  const q=l.qs[qo[qi]];
  document.getElementById('ht').textContent=q.h;
  document.getElementById('qk').innerHTML=q.b+'<span class="bl" id="bl">（　　　）</span>'+q.a;
  const opts=sh([q.ans,...q.d]);
  const c=document.getElementById('os'); c.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='ob'; b.textContent=o;
    b.onclick=()=>chk(o,q,b,c); c.appendChild(b);
  });
  document.getElementById('pf').style.width=((qi/l.qs.length)*100)+'%';
  document.getElementById('cnt').textContent=(qi+1)+' / '+l.qs.length;
  document.getElementById('ts').textContent=qs+'点';
}

function chk(sel,q,btn,c){
  if(answered)return; answered=true;
  const rt = Date.now()-qStart; // ★ 反応時間(ms)
  const isOk = sel===q.ans;
  const bl=document.getElementById('bl'), fb=document.getElementById('fb');
  c.querySelectorAll('.ob').forEach(b=>{
    b.classList.add('used');
    if(b.textContent===q.ans) b.classList.add('co');
  });
  if(isOk){
    bl.textContent=sel; bl.className='bl ok';
    qs+=10;
    document.getElementById('sc-v').textContent=qs;
    document.getElementById('ts').textContent=qs+'点';
    fb.className='fb show ok';
    document.getElementById('fbf').textContent='正解！　'+q.full;
  } else {
    bl.textContent=sel; bl.className='bl ng';
    fb.className='fb show ng';
    document.getElementById('fbf').textContent='不正解。正解は「'+q.ans+'」です。　'+q.full;
  }
  document.getElementById('fbn').textContent=q.note;
  document.getElementById('nb').classList.add('show');

  // ★ ログ送信
  sendLog({
    type:'ANSWER',
    student: studentId,
    session: sessionId,
    timestamp: nowStr(),
    lessonNum: L[cur].num,
    questionNum: qo[qi]+1,
    questionText: q.b+'（　）'+q.a,
    correct: isOk ? '1' : '0',
    answer: sel,
    correctAnswer: q.ans,
    rt_ms: rt,
    score: qs
  });
}

function nxt(){qi++; loadQ();}

function fin(){
  const l=L[cur]; done[cur]=true; grids();
  const ni=cur+1<L.length?cur+1:-1;
  // ★ 課完了ログ
  sendLog({
    type:'LESSON_COMPLETE', student:studentId, session:sessionId,
    timestamp:nowStr(), lessonNum:l.num, questionNum:'',
    correct:'', answer:'', rt_ms:'', score:qs
  });
  document.getElementById('body').innerHTML=`
    <div class="fin">
      <h3>第${l.num}課 完了！</h3>
      <div class="big">${qs} <span style="font-size:16px;color:#666;">/ ${l.qs.length*10}点</span></div>
      <p class="gram">${l.gram}</p>
      <div class="fbs">
        <button class="fr" onclick="retry()">もう一度</button>
        ${ni>=0?`<button class="fn" onclick="gn(${ni})">第${L[ni].num}課へ →</button>`:''}
      </div>
    </div>
    <div class="tip"><p>間違えた問題は「もう一度」で復習しましょう。</p></div>`;
}

function retry(){rb();sel(cur);}
function gn(i){rb();sel(i);}

function rb(){
  document.getElementById('body').innerHTML=`
    <div class="li" id="li">
      <div><div class="li-n" id="li-n"></div><div class="li-t" id="li-t"></div><div class="li-g" id="li-g"></div></div>
      <div class="sc"><div class="sc-v" id="sc-v">0</div><div class="sc-l">点</div></div>
    </div>
    <div class="pr"><span id="cnt"></span><span id="ts" style="font-size:11px;color:#1D9E75;font-weight:500;"></span></div>
    <div class="pb"><div class="pf" id="pf" style="width:0%"></div></div>
    <div class="hc"><span class="hl">ヒント</span><span id="ht">—</span></div>
    <div class="qc"><div class="qk" id="qk"></div><div class="os" id="os"></div></div>
    <div class="fb" id="fb"><div class="fb-f" id="fbf"></div><div class="fb-n" id="fbn"></div></div>
    <button class="nb" id="nb" onclick="nxt()">次の問題 →</button>
    <div class="tip"><p>（　）に入る韓国語を選んでください。ヒントは空欄に入る語の日本語の意味です。</p></div>`;
}
</script>
</body>
</html>
